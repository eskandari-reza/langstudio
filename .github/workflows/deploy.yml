name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/eskandari-reza/langstudio-${{ matrix.target }}:latest
            ghcr.io/eskandari-reza/langstudio-${{ matrix.target }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=/backend
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
      # - name: Copy stack files and deploy
      #   env:
      #     HOST: ${{ secrets.DEPLOY_HOST }}
      #     DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      #   run: |
      #     scp deploy/docker-compose.prod.yml "$DEPLOY_USER@$HOST:/opt/langstudio/docker-compose.yml"
      #     scp deploy/Caddyfile "$DEPLOY_USER@$HOST:/opt/langstudio/Caddyfile"
      #     scp deploy/backup.sh "$DEPLOY_USER@$HOST:/opt/langstudio/backup.sh"
      #     ssh "$DEPLOY_USER@$HOST" 'cd /opt/langstudio && chmod +x backup.sh && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f'
      - name: Copy stack files and deploy
        timeout-minutes: 10
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          scp deploy/docker-compose.prod.yml "$DEPLOY_USER@$HOST:/opt/langstudio/docker-compose.yml"
          scp deploy/Caddyfile "$DEPLOY_USER@$HOST:/opt/langstudio/Caddyfile"
          scp deploy/backup.sh "$DEPLOY_USER@$HOST:/opt/langstudio/backup.sh"
          
          # لاگین به GHCR با استفاده از توکن گیت‌هاب
          ssh "$DEPLOY_USER@$HOST" "echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          
          # اجرای دستورات با محدودیت زمانی
          ssh "$DEPLOY_USER@$HOST" 'cd /opt/langstudio && chmod +x backup.sh && timeout 300 docker compose pull && timeout 300 docker compose up -d --remove-orphans && docker image prune -f'