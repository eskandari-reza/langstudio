# langstudio Lab production stack. Copied to /opt/langstudio/docker-compose.yml by the deploy workflow.
# Secrets are read from /opt/langstudio/.env (never committed).
name: langstudio

services:
  postgres:
    image: postgres:16-alpine
    container_name: langstudio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: langstudio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in /opt/langstudio/.env}
      POSTGRES_DB: langstudio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langstudio -d langstudio"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  # one-shot: applies database migrations, then exits
  migrate:
    image: ghcr.io/eskandari-reza/langstudio-api:${IMAGE_TAG:-latest}
    command: ["node", "packages/db/dist/migrate.js"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://langstudio:${POSTGRES_PASSWORD}@postgres:5432/langstudio
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  api:
    image: ghcr.io/eskandari-reza/langstudio-api:${IMAGE_TAG:-latest}
    container_name: langstudio-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgres://langstudio:${POSTGRES_PASSWORD}@postgres:5432/langstudio
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in /opt/langstudio/.env}
      AUTH_MODE: ${AUTH_MODE:-dev}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal]

  web:
    image: ghcr.io/eskandari-reza/langstudio-web:${IMAGE_TAG:-latest}
    container_name: langstudio-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://langstudio:${POSTGRES_PASSWORD}@postgres:5432/langstudio
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-https://langstudio.ir}
      AUTH_TRUST_HOST: "true"
      AUTH_MODE: ${AUTH_MODE:-dev}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  # caddy:
  #   image: caddy:2
  #   container_name: langstudio-caddy
